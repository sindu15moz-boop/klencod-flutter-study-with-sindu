name: study_with_sindu
description: A professional task manager.
publish_to: 'none'
version: 1.2.2+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  fl_chart: ^0.66.0
  audioplayers: ^5.2.1
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.16.0
  google_sign_in: ^6.2.1
  firebase_storage: ^11.6.0
  google_sign_in: ^6.1.6
  intl: ^0.19.0
  video_player: ^2.8.2  # <--- زدنا هادي تاع الفيديو

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/ghost.png
    - assets/noise1.mp3
    - assets/noise2.mp3
    - assets/ocean.mp3
    - assets/rain1.mp3
    - assets/rain2.mp3
    - assets/app_icon.png
    - assets/app_icon_bg.png
    - assets/background.mp4

  fonts:
    - family: Sanchez
      fonts:
        - asset: assets/Sanchez-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/app_icon_bg.png"
  adaptive_icon_foreground: "assets/app_icon.png"