
name: Build Study with Sindu APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # Restore the permanent Android Debug Keystore
      - name: Restore Stable Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p ~/.android

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > ~/.android/debug.keystore

          keytool -list \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android

      # Generate Launcher Icons
      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      # Build APK
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # Print SHA-1 Fingerprint
      - name: Print SHA-1 Fingerprint
        run: |
          set -e

          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep SHA1

      # Verify APK Signature
      - name: Verify APK Signature
        run: |
          set -e

          APK_DIR="build/app/outputs/flutter-apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          if ! ls "$APK_DIR"/*.apk >/dev/null 2>&1; then
            echo "ERROR: No APK files found."
            exit 1
          fi

          for APK in "$APK_DIR"/*.apk; do
            echo "======================================"
            echo "APK: $APK"
            echo "======================================"

            "$APKSIGNER" verify --print-certs "$APK"
          done

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/
          if-no-files-found: error
