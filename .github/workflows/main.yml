
name: Build Study with Sindu APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # 1. نولد الأيقونات (باش الشبح يبان)
      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      # 2. نبنيو الـ APK
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # 3. نجيبو SHA-1 من ملفات APK الحقيقية
      - name: Print SHA-1 Fingerprint
        run: |
          set -e

          APK_DIR="build/app/outputs/flutter-apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          if ! ls "$APK_DIR"/*.apk >/dev/null 2>&1; then
            echo "ERROR: No APK files found."
            exit 1
          fi

          for APK in "$APK_DIR"/*.apk; do
            echo "======================================"
            echo "APK: $APK"
            echo "======================================"

            "$APKSIGNER" verify --print-certs "$APK"
          done

      # 4. نرفعو الـ APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/
