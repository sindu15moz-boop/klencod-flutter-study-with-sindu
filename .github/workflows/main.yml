name: Build Study with Sindu APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # 1. نولد الأيقونات (باش الشبح يبان)
      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      # 2. نبنيو الـ APK (وهنا كيتخلق الـ keystore)
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # 3. نجيبو SHA-1 (من بعد البناء باش نلقاو الـ keystore)
      - name: Print SHA-1 Fingerprint
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep SHA1 || echo "Keystore not found."

      # 4. نرفعو الـ APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/